<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#f2f2f2;
}

/* Top Gradient Section */
.project-section{
    background: linear-gradient(90deg, #7b7bd6, #6c63ff);
    color:white;
    padding:30px 40px;
    margin-top:50px;
}

/* Contact Button */
.contact-btn{
    background:#222;
    color:white;
    border:none;
    padding:10px 25px;
}

.contact-btn:hover{
    background:black;
}

/* Footer */
.footer{
    background:#0f172a;
    color:#cbd5e1;
    padding:60px 0;
}

.footer h6{
    color:white;
    margin-bottom:15px;
}

.footer a{
    color:#cbd5e1;
    text-decoration:none;
    display:block;
    margin-bottom:8px;
    font-size:14px;
}

.footer a:hover{
    color:white;
}

/* Social Icons */
.social-icons i{
    /* background:#6366f1; */
    color:white;
    width:45px;
    height:45px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    margin-right:8px;
    font-size:15px;
}
</style>
</head>

<body>

<div class="container">

    <!-- Top Section -->
    <div class="project-section d-flex justify-content-between align-items-center rounded shadow">
        <div>
            <h4 class="mb-1">Ready for a next project?</h4>
            <p class="mb-0 small">Let's get started!</p>
        </div>
        <button class="contact-btn rounded">Contact us</button>
    </div>

</div>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <div class="row gy-4">

            <div class="col-md-2">
                <h6>COLORLIB</h6>
                <small>© 2019</small>
            </div>

            <div class="col-md-2">
                <h6>Customers</h6>
                <a href="#">Buyer</a>
                <a href="#">Supplier</a>
            </div>

            <div class="col-md-2">
                <h6>Company</h6>
                <a href="#">About us</a>
                <a href="#">Careers</a>
                <a href="#">Contact us</a>
            </div>

            <div class="col-md-2">
                <h6>Further Information</h6>
                <a href="#">Terms & Conditions</a>
                <a href="#">Privacy Policy</a>
            </div>

            <div class="col-md-4">
                <h6>Follow us</h6>
                <div class="social-icons">
                    <i class="fa-brands fa-facebook"></i>
                    <i class="fa-brands fa-square-twitter"></i>
                    <i class="fa-brands fa-linkedin"></i>
                   <i class="fa-brands fa-telegram"></i>
                </div>
            </div>

        </div>
    </div>
</footer>
<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
