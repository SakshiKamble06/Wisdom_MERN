<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Style CSS Carousel</title>

<!-- Bootstrap 5.3 CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background-color:#141414;
    color:white;
}

/* Horizontal scroll container */
.scroll-container{
    display:flex;
    gap:20px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    padding:20px;
}

.scroll-container::-webkit-scrollbar{
    display:none;
}

/* Movie Card Fixed Size */
.movie-card{
    min-width:250px;
    max-width:250px;
    height:420px;
    background:#1c1c1c;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    scroll-snap-align:start;
    transition:0.3s ease;
    flex-shrink:0;
}

/* Same Height Images */
.movie-card img{
    width:100%;
    height:320px;
    object-fit:cover;
}

/* Hover zoom effect */
.movie-card:hover{
    transform:scale(1.05);
}

/* Big ranking number */
.rank-number{
    position:absolute;
    bottom:90px;
    left:10px;
    font-size:80px;
    font-weight:bold;
    color: white;
    opacity:0.7;
}

/* Highlighted Movie Title Box */
.card-body{
    background:#000;
    text-align:center;
}

.card-title{
    background:#e50914;   /* Netflix Red */
    padding:6px 10px;
    border-radius:6px;
    font-size:14px;
    font-weight:600;
    display:inline-block;
}
</style>
</head>
<body>

<div class="container position-relative mt-5">

<h3 class="mb-4">Trending Now</h3>

<!-- Scroll Row -->
<div class="scroll-container">

    <div class="movie-card">
        <span class="rank-number ">1</span>
        <img src="./assets/m1.jpg" alt="">
        <div class="card-body p-2">
                <h6 class="card-title text-center">Shadow Bone</h6>
            </div>
    </div>

    <div class="movie-card">
        <span class="rank-number">2</span>

        <div class="card-body p-2">
                <h6 class="card-title text-center">Prince</h6>
            </div>
    </div>

    <div class="movie-card">
        <span class="rank-number">3</span>
        <img src="./assets/3.jpg" alt="">
        <div class="card-body p-2">
                <h6 class="card-title text-center">Kalki</h6>
            </div>
    </div>

    <div class="movie-card">
        <span class="rank-number">4</span>
        <img src="./assets/4.jpg" alt="">
         <div class="card-body p-2">
                <h6 class="card-title text-center">Dhurandhar</h6>
            </div>
    </div>

    <div class="movie-card">

            </div>
    </div>
    <div class="movie-card">

    <div class="movie-card">
        <span class="rank-number">7</span>
        <img src="./assets/7 (1).jpg" alt="">
         <div class="card-body p-2">
                <h6 class="card-title text-center">Varansi</h6>
            </div>
    </div>

    <div class="movie-card">
        <span class="rank-number">8</span>

</div>

</div>

</body>
</html>
