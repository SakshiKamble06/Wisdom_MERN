<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Lists Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="title">HTML Lists</h1>

<table class="main-table">
    <tr>
        <!-- Fruits -->
        <td>
            <table class="inner-table">
                <tr>
                    <th class="head fruits">FRUITS</th>
                </tr>
                <tr><td>1. Apple</td></tr>
                <tr><td>2. Mango</td></tr>
                <tr><td>3. Orange</td></tr>
            </table>
        </td>

        <!-- Vegetables -->
        <td>
            <table class="inner-table">
                <tr>
                    <th class="head vegetables">VEGETABLES</th>
                </tr>
                <tr><td>▪ Potato</td></tr>
                <tr><td>▪ Tomato</td></tr>
                <tr><td>▪ Onion</td></tr>
            </table>
        </td>

        <!-- Groceries -->
        <td>
            <table class="inner-table">
                <tr>
                    <th class="head groceries">GROCERIES</th>
                </tr>
                <tr><td>● Rice</td></tr>
                <tr><td>● Flour</td></tr>
                <tr><td>● Pulses</td></tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
