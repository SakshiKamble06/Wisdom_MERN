<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Fruit</title>

<style>

.griContainerFruit{
    display: grid;
    width: 450px;
    margin: 20px auto;
    gap: 15px;

    /* Define grid structure */
    grid-template-columns: 100px 100px 200px;
    grid-template-rows: 100px 150px 150px;
}

/* Make all images fit inside box */
.griContainerFruit div img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Grid positions */

.grapes{
    /* grid-row: 1 / 2;
    grid-column: 1 / 2; */
     grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 2;
}

.strawberry{
    /* grid-row: 1 / 2;
    grid-column: 2 / 3; */
    grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 2;
            grid-column-end: 3;
}

.watermelon{
    grid-row: 1 / 3;
    grid-column: 3 / 4;
            grid-row-start: 1;
            grid-row-end: 3;
            grid-column-start: 3;
            grid-column-end: 4;
}

.orange{
    /* grid-row: 2 / 3;
    grid-column: 1 / 3; */
            grid-row-start: 2;
            grid-row-end: 3;
            grid-column-start: 1;
            grid-column-end: 3;
}

.papaya{
    /* grid-row: 3 / 4;
    grid-column: 1 / 3; */
            grid-row-start: 3;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;
}

.pineapple{
    /* grid-row: 3 / 4;
    grid-column: 3 / 4; */
           grid-row-start: 3;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 4;
}

</style>
</head>

<body>

<div class="griContainerFruit">
    <div class="grapes">
        <img src="./Grapes.jpg" alt="grapes">
    </div>
    <div class="strawberry">
        <img src="Strawberry.jpg" alt="strawberry">
    </div>
    <div class="watermelon">
        <img src="Watermelon.jpg" alt="watermelon">
    </div>
    <div class="orange">
        <img src="Orange.jpg" alt="orange">
    </div>
    <div class="papaya">
        <img src="./Papaya.jpg" alt="papaya">
    </div>
    <div class="pineapple">
        <img src="./Pineapple.jpg" alt="pineapple">
    </div>
</div>

</body>
</html>
