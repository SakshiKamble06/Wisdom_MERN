<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Grid Layout</title>
    <link rel="stylesheet" href="style.css">
    <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #f4f4f4;
    padding: 40px;
    font-family: Arial, sans-serif;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 200px;
    gap: 15px;
}

.box {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
}

.box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.box h3 {
    position: absolute;
    top: 15px;
    left: 15px;
    color: white;
    font-size: 18px;
    text-shadow: 2px 2px 5px black;
}

/* Different Sizes */
.box1 {
    grid-column: span 1;
    grid-row:span 2;
}

.box2 {
    grid-column: span 3;
    grid-row: span 2;
}

.box3 {
    grid-column: span 3;
    grid-row: span 2;
}

.box4 {
    grid-column: span 1;
    grid-row: span 2;
}

.box5 {
    grid-column: span 1;
    grid-row:span 1;
}

.box6 {
    grid-column:span 1;
    grid-row:span 1;
}
.box7{
    grid-column:span 2;
    grid-row:span 1;
}
    </style>
</head>
<body>

<div class="gallery">

    <div class="box box1">
        <img src="https://picsum.photos/600/400?1" alt="">
        <h3>The winter of my discontent</h3>
    </div>

    <div class="box box2">
        <img src="https://picsum.photos/900/400?2" alt="">
        <h3>Instagram is toxic but I keep posting</h3>
    </div>

    <div class="box box3">
        <img src="https://picsum.photos/900/500?3" alt="">
        <h3>Throwing my phone into the ocean</h3>
    </div>

    <div class="box box4">
        <img src="https://picsum.photos/400/500?4" alt="">
        <h3>I'm not here to be perfect</h3>
    </div>

    <div class="box box5">
        <img src="https://picsum.photos/600/200?5" alt="">
        <h3>Staring at the horizon thinking</h3>
    </div>

    <div class="box box6">
        <img src="https://picsum.photos/600/200?6" alt="">
        <h3>This is water</h3>
    </div>

    <div class="box box7">
        <img src="https://picsum.photos/400/500?4" alt="">
        <h3>I'm not here to be perfect</h3>
    </div>


</div>

</body>
</html>
