<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive CSS Grid</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#7b2ff7,#f107a3);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* MAIN GRID */
.container{
    display:grid;
    width:80%;
    max-width:900px;
    background:white;
    padding:10px;
    gap:10px;
    border-radius:10px;

    grid-template-columns: 1fr 2fr;
    grid-template-rows: 80px 200px 200px 80px;
}

/* Grid Areas */
.header{
    grid-column:1 / 3;
    background:#5ed6d6;
}

.sidebar{
    grid-row:2 / 4;
    grid-column:1 / 2;
    background:#3ccfcf;
}

.main{
    grid-row:2 / 3;
    grid-column:2 / 3;
    background:#4dd0e1;
}

.content1{
    grid-row:3 / 4;
    grid-column:2 / 3;
    background:#66e0e0;
}

.footer{
    grid-column:1 / 3;
    background:#48c9c9;
}

/* Common Style */
.container div{
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    color:#003333;
    border-radius:6px;
}

/* RESPONSIVE (Mobile View) */
@media(max-width:768px){

    .container{
        grid-template-columns:1fr;
        grid-template-rows:auto;
    }

    .header{
        grid-column:1;
    }

    .sidebar{
        grid-column:1;
        grid-row:auto;
    }

    .main{
        grid-column:1;
        grid-row:auto;
    }

    .content1{
        grid-column:1;
        grid-row:auto;
    }

    .footer{
        grid-column:1;
    }
}

</style>
</head>
<body>

<div class="container">
    <div class="header">HEADER</div>
    <div class="sidebar">SIDEBAR</div>
    <div class="main">MAIN</div>
    <div class="content1">CONTENT</div>
    <div class="footer">FOOTER</div>
</div>

</body>
</html>
