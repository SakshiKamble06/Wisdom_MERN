<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive CSS Grid</title>

<style>
    .gridContainerLayout{
            display: grid; 
            grid-template-areas: 'Navbar Navbar Navbar Navbar'
                                'sidebar mai mai '
                                'sidebar content content cotent'
                                'foo foo foo foo'
            ;  
          gap: 10px;
         
        } 
        nav{
            grid-area: Navbar;
            height: 100px;
              border: 2px solid black ;
        }
        aside{
            grid-area: sidebar;
            height: 90px;
            background-color: rgb(218, 218, 255);
              border: 2px solid black ;
        }
        .main{
            grid-area: mai;
            height: 300px;
             border: 2px solid black ;
        }
      
        .content{
            grid-area: rightSide;
            height: 300px;
             border: 2px solid black ;
        }
        footer{
            grid-area: foo;
            height: 100px;
            background-color: gray;
              border: 2px solid black ;
        }
         @media screen and (max-width:600px){
                body{
                    background-color: pink;
                }
                
                .gridContainerLayout{
                               grid-template-areas: 'headerOne'
                                'Navbar'
                                'mai'
                                'leftSide'
                                'rightSide'
                                'foo'
            ;
                }
        }
