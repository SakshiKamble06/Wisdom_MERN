<!DOCTYPE html>
<html>
<head>
    <title>Responsive Image Gallery</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="gallery">
        <img src="https://picsum.photos/300/300?1" alt="Image1">
        <img src="https://picsum.photos/300/300?2" alt="Image2">
        <img src="https://picsum.photos/300/300?3" alt="Image3">
        <img src="https://picsum.photos/300/300?4" alt="Image4">
        <img src="https://picsum.photos/300/300?5" alt="Image5">
        <img src="https://picsum.photos/300/300?6" alt="Image6">
        <img src="https://picsum.photos/300/300?7" alt="Image7">
        <img src="https://picsum.photos/300/300?8" alt="Image8">
    </div>

</body>
</html>
