<!DOCTYPE html>
<html>
<head>
    <title>Grid Layout with Named Areas</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 3fr;   /* Sidebar 1 part, Main 3 parts */
            grid-template-rows: 1fr 4fr 1fr;  /* Header, Content, Footer */
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            height: 100vh;
            gap: 10px;
        }

        .header {
            grid-area: header;
            background-color: #3498db;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #2ecc71;
            color: white;
            padding: 20px;
        }

        .main {
            grid-area: main;
            background-color: #f39c12;
            color: white;
            padding: 20px;
        }

        .footer {
            grid-area: footer;
            background-color: #e74c3c;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="main">Main Content</div>
        <div class="footer">Footer</div>
    </div>

</body>
</html>
