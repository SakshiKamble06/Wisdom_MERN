<!DOCTYPE html>
<html>
<head>
    <title>Instagram Layout</title>
    <link rel="stylesheet" href="./Insta.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="main">
    <!-- LEFT SECTION -->
    <div class="left">
     <!-- LOGO TOP LEFT -->
    <div class="insta-logo">
        <img src="./logo.jpeg" alt="phone mockup">
       
        <div class="image-box">
            <img src="./Insta.jpg"  alt="friends">
        </div>
    </div>
        <div class="text">
            <div class="heading">
                See everyday moments from
            </div>

            <div class="highlight">
                your close friends.
            </div>
        </div>

    </div>

    <!-- RIGHT SECTION -->
    <div class="right">

        <div class="login-box">

            <div class="login-title">
                Log into Instagram
            </div>

            <!-- FORM START -->
            <form>

                <div class="input-box">
                    <input type="text"
                           name="username"
                           placeholder="Mobile number, username or email"
                           required>
                </div>

                <div class="input-box">
                    <input type="password"
                           name="password"
                           placeholder="Password"
                           required>
                </div>

                <button type="submit" class="login-btn">
                    Log In
                </button>

            </form>
            <!-- FORM END -->

            <div class="forgot">
                Forgot password?
            </div>

            <div class="divider"></div>

            <div class="fb-btn">
                Log in with Facebook
            </div>

            <div class="signup">
                Don't have an account? <span>Sign up</span>
            </div>

        </div>

    </div>

</div>

</body>
</html>
