<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="./style4.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
    <h2>Registration</h2>

    <div class="type">
        <label><input type="radio" name="type" checked> Personal</label>
        <label><input type="radio" name="type"> Company</label>
    </div>

    <form>
        <div class="input-box">
            <span class="icon"><i class="fa fa-envelope"></i></span>
            <input type="email" placeholder="Email">
        </div>

        <div class="input-box">
            <span class="icon"><i class="fa fa-user"></i></span>
            <input type="text" placeholder="Name">
        </div>

        <div class="input-box">
            <span class="icon"><i class="fa fa-lock"></i></span>
            <input type="password" placeholder="Password">
        </div>

        <div class="gender">
            <label><input type="radio" name="gender" checked> Male</label>
            <label><input type="radio" name="gender"> Female</label>
        </div>

        <p class="terms">
            By clicking Register, you agree on our <a href="#">terms & conditions</a>.
        </p>

        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>
