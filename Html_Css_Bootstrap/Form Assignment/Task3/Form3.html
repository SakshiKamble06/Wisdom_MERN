<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Registration Form</title>
    <link rel="stylesheet" href="style3.css" />
  </head>
<body>

<div class="form-container">
    <h1>Registration</h1>

    <h2>Personal Details</h2>
    <div class="form1">

        <div>
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" required>
        </div>
        <div>
            <label>Mobile Number</label>
            <input type="text" placeholder="Enter mobile number" required>
        </div>

        <div>
            <label>Date of Birth</label>
            <input type="date">
        </div>

        <div>
            <label>Gender</label>
            <select>
                <option>Select gender</option>
                <option>Male</option>
                <option>Female</option>
                
            </select>
        </div>

        <div>
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div>
            <label>Occupation</label>
            <input type="text" placeholder="Enter occupation">
        </div>
    </div>

    <h2>Identity Details</h2>
    <div class="form1">
        <div>
            <label>ID Type</label>
            <select>
                <option>Select ID type</option>
                <option>Aadhar</option>
                <option>Passport</option>
                <option>Voter ID</option>
            </select>
        </div>

        <div>
            <label>ID Number</label>
            <input type="text" placeholder="Enter ID number" required>
        </div>

        <div>
            <label>Issue Date</label>
            <input type="date">
        </div>

        <div>
            <label>Issue State</label>
            <input type="text" placeholder="Enter issue state">
        </div>

        <div>
            <label>Issue Authority</label>
            <input type="text" placeholder="Enter issue authority">
        </div>

        <div>
            <label>Expiry Date</label>
            <input type="date">
        </div>
    </div>

    <button class="btn">Next →</button>
</div>

</body>
</html>
