<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Landing Section</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #c4056e, #1981ad);
}

/* Landing Section */
.landing{
    text-align:center;
    color:white;
}

/* Animated Heading */
.landing h1{
    font-size:50px;
    margin-bottom:20px;
    animation: slideDown 1.5s ease forwards;
    opacity:0;
}

/* Paragraph */
.landing p{
    font-size:18px;
    margin-bottom:30px;
    animation: fadeIn 2s ease forwards;
    /* animation-direction: fadeIn ease-in forwards; */
    animation-delay: 1s;
    opacity:0;
}

/* Button */
.btn{
    padding:12px 30px;
    background:white;
    color:#6c63ff;
    border:none;
    font-size:16px;
    cursor:pointer;
    border-radius:30px;
    transition: all 0.4s ease;
}

/* Hover Animation */
.btn:hover{
    background:#222;
    color:white;
    transform: scale(1.1);
}

/* Animations */
@keyframes slideDown{
    from{
        transform: translateY(-50px);
        opacity:0;
    }
    to{
        transform: translateY(0);
        opacity:1;
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}
</style>
</head>

<body>

<div class="landing">
    <h1>Welcome to Animation World !</h1>
    <p>Create something amazing with us.</p>
    <button class="btn">Get Started</button>
</div>

</body>
</html>
